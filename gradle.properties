# Project
# Version string only used in dev, however when making a tag on github it should be like major.minor.bug.mc+loader
# Example: 4.0.0.121012 -> 4.0.0, then 1 21 01 for Minecraft 1.21.1, then 2 for NeoForge (1 is Forge).
# (This also helps for bug reports as the version number gives us a clue as to what version of Minecraft the bug happened on)
mod_version = 4.0.0.121012
mod_name = Modern Metals
mod_id = modernmetals
mod_archive_name = modernmetals
mod_description = Adds industrial metals and alloys, including aluminum, chromium, osmium and titanium, with their ores, molten forms, equipment and building blocks.
mod_group = zone.moddev.mc.modernmetals
mod_authors = jriwanek, DShadowWolf, the MMD Team
mod_credits = Cyanobacterium (aka DrCyano), lclc98 for all the help
mod_license = LGPL-2.1-only
curseforge_id = 244357
update_url = https://raw.githubusercontent.com/MinecraftModDevelopmentMods/ModernMetals/refs/heads/master-1.21.1/update.json
issue_url = https://github.com/MinecraftModDevelopmentMods/ModernMetals/issues

# Dependencies
minecraft_version = 1.21.1
minecraft_version_range = [1.21.1,1.22)
neoforge_version = 21.1.265
neoforge_version_range = [21.1.265,)
loader_version_range = [3,)

# MMDLib provides the material system; OreSpawn generates the ores.
mmdlib_version = 2.0.2.121012+Neo
mmdlib_version_range = [2.0.2,)
orespawn_version = 4.1.0.121012
orespawn_version_range = [4.0.16.121012,5.0.0)

# Parchment (parameter names + javadocs on top of Mojang mappings)
# Versions: https://parchmentmc.org/docs/getting-started
parchment_minecraft_version = 1.21.1
parchment_mappings_version = 2024.11.17

# Gradle
org.gradle.jvmargs = -Xmx3G
org.gradle.daemon = false
org.gradle.configuration-cache = false
org.gradle.caching = true
org.gradle.parallel = false
