import groovy.xml.XmlParser
import groovy.xml.XmlUtil
import org.apache.tools.ant.filters.FixCrLfFilter

plugins {
    id 'java'
    id 'maven-publish'
    id 'eclipse'
    id 'net.minecraftforge.renamer' version '1.1.5'
    id 'net.minecraftforge.gradle' version '7.0.34'
}

group = mod_group
version = mod_version
base.archivesName = 'ModernMetals'

java {
    toolchain.languageVersion = JavaLanguageVersion.of(8)
    withSourcesJar()
    withJavadocJar()
}

sourceSets {
    clientIntegrationTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    integrationTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
configurations {
    clientIntegrationTestImplementation.extendsFrom implementation
    clientIntegrationTestRuntimeOnly.extendsFrom runtimeOnly
    integrationTestImplementation.extendsFrom implementation
    integrationTestRuntimeOnly.extendsFrom runtimeOnly
}
def probeClasses = layout.buildDirectory.dir('forge-run-mod-classes/probe')
def clientProbeClasses = layout.buildDirectory.dir('forge-run-mod-classes/client-probe')
def prepareClientProbeClasses = tasks.register('prepareClientProbeClasses', Sync) {
    dependsOn 'clientIntegrationTestClasses'
    from sourceSets.clientIntegrationTest.output
    into clientProbeClasses
}
def prepareProbeClasses = tasks.register('prepareProbeClasses', Sync) {
    dependsOn 'integrationTestClasses'
    from sourceSets.integrationTest.output
    into probeClasses
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

def compileMiningLevelChecks = tasks.register('compileMiningLevelChecks', JavaCompile) {
    dependsOn 'classes'
    source fileTree('tools/validation/port113/mining-levels') { include '*.java' }
    classpath = sourceSets.main.output + sourceSets.main.compileClasspath
    destinationDirectory = layout.buildDirectory.dir('classes/mining-level-checks')
    javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(8) }
}
tasks.register('verifyMiningLevels', JavaExec) {
    dependsOn compileMiningLevelChecks
    classpath = files(compileMiningLevelChecks.flatMap { it.destinationDirectory }) + sourceSets.main.runtimeClasspath
    mainClass = 'validation.MiningLevelChecks'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(8) }
}
tasks.named('check') { dependsOn 'verifyMiningLevels' }
tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:none', '-quiet')
    options.addBooleanOption('notimestamp', true)
}
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    filteringCharset = 'UTF-8'
    filesMatching(['**/*.java', '**/*.json', '**/*.toml', '**/*.mcmeta', '**/*.md', '**/*.txt']) {
        filter(FixCrLfFilter, eol: FixCrLfFilter.CrLf.newInstance('lf'))
    }
}

def runClasses = layout.buildDirectory.dir('forge-run-mod-classes/main')
def prepareRunClasses = tasks.register('prepareForgeRunModClasses', Sync) {
    dependsOn tasks.named('classes')
    from sourceSets.main.output
    into runClasses
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    runs {
        configureEach {
            mainClass = 'net.minecraftforge.userdev.LaunchTesting'
            workingDir.convention layout.projectDirectory.dir('run')
            mods { modernmetals { source sourceSets.main } }
            environment 'target', name.toLowerCase().contains('client') ? 'fmluserdevclient' : 'fmluserdevserver'
            environment 'MCP_MAPPINGS', "${mapping_channel}_${mapping_version}"
            environment 'MCP_VERSION', mcp_version
            environment 'FORGE_VERSION', forge_version
            environment 'FORGE_GROUP', 'net.minecraftforge'
            environment 'MC_VERSION', minecraft_version
            def output = runClasses.get().asFile.absolutePath
            environment 'MOD_CLASSES', "modernmetals%%${output}${File.pathSeparator}modernmetals%%${output}"
        }
        register('client')
        register('server') { args '--nogui' }
        register('probeClient') {
            workingDir.convention layout.projectDirectory.dir(providers.gradleProperty('probeClientDirectory').orElse('run/verification/client').get())
            mods { modernmetalsclientprobe { source sourceSets.clientIntegrationTest } }
            systemProperty 'modernmetalsclientprobe.expectBase', providers.gradleProperty('probeExpectBaseMetals')
                    .orElse(providers.gradleProperty('withBaseMetals').orElse('false')).get()
            def mainOutput = runClasses.get().asFile.absolutePath
            def probeOutput = clientProbeClasses.get().asFile.absolutePath
            environment 'MOD_CLASSES', "modernmetals%%${mainOutput}${File.pathSeparator}modernmetals%%${mainOutput}${File.pathSeparator}modernmetalsclientprobe%%${probeOutput}${File.pathSeparator}modernmetalsclientprobe%%${probeOutput}"
        }
        register('runtimeProbeServer') {
            workingDir.convention layout.projectDirectory.dir(providers.gradleProperty('probeDirectory').orElse('run/verification/standalone-high').get())
            mods { modernmetalsprobe { source sourceSets.integrationTest } }
            def mainOutput = runClasses.get().asFile.absolutePath
            def probeOutput = probeClasses.get().asFile.absolutePath
            environment 'MOD_CLASSES', "modernmetals%%${mainOutput}${File.pathSeparator}modernmetals%%${mainOutput}${File.pathSeparator}modernmetalsprobe%%${probeOutput}${File.pathSeparator}modernmetalsprobe%%${probeOutput}"
            args '--nogui'
            systemProperty 'modernmetalsprobe.titanium', providers.gradleProperty('probeTitanium').orElse('false').get()
            if (providers.gradleProperty('probeWorldUpgrade').orElse('false').get().toBoolean()) {
                systemProperty 'modernmetalsprobe.upgrade', 'true'
                args '--forceUpgrade'
            }
        }
    }
}

tasks.withType(JavaExec).configureEach {
    if (name in ['runClient', 'runServer', 'runRuntimeProbeServer', 'runProbeClient']) {
        dependsOn prepareRunClasses
        javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(8) }
        doFirst { new File(workingDir, 'mods').mkdirs() }
    }
    if (name == 'runRuntimeProbeServer') dependsOn prepareProbeClasses
    if (name == 'runProbeClient') dependsOn prepareClientProbeClasses
    if (name in ['runRuntimeProbeServer', 'runProbeClient']) {
        String receiptName = name == 'runProbeClient' ? 'client-probe.json' : 'modernmetals-probe.json'
        doFirst {
            // ForgeGradle sets JavaExec's workingDir in its own later action.
            // Validate and prepare the declared run directory before that happens.
            boolean clientProbe = name == 'runProbeClient'
            File runDirectory = file(providers.gradleProperty(clientProbe ? 'probeClientDirectory' : 'probeDirectory')
                    .orElse(clientProbe ? 'run/verification/client' : 'run/verification/standalone-high').get()).canonicalFile
            if (!runDirectory.toPath().startsWith(file('run/verification').canonicalFile.toPath())
                    && !runDirectory.toPath().startsWith(layout.buildDirectory.get().asFile.canonicalFile.toPath())
                    && !new File(runDirectory, '.modernmetals-disposable-test').isFile())
                throw new GradleException("Probe runs require a disposable test directory: ${runDirectory}; expected under ${file('run/verification').canonicalFile}")
            runDirectory.mkdirs()
            workingDir runDirectory
            if (name == 'runRuntimeProbeServer') {
                File eula = new File(runDirectory, 'eula.txt')
                if (!eula.exists()) eula.text = 'eula=true\n'
                File settings = new File(runDirectory, 'server.properties')
                if (!settings.exists()) settings.text = 'online-mode=false\nserver-port=0\nview-distance=2\nspawn-protection=0\nmax-tick-time=0\nlevel-seed=14162026\n'
            }
            File receipt = new File(workingDir, receiptName)
            if (receipt.exists()) {
                java.nio.file.Files.move(receipt.toPath(), new File(workingDir,
                        receiptName + '.' + System.currentTimeMillis() + '.previous').toPath())
            }
        }
        doLast {
            File receipt = new File(workingDir, receiptName)
            if (!receipt.isFile() || new groovy.json.JsonSlurper().parse(receipt).status != 'passed') {
                throw new GradleException("Native test failed; see ${receipt}")
            }
            if (name == 'runProbeClient') {
                def errors = new File(workingDir, 'logs/latest.log').readLines('UTF-8').findAll { line ->
                    (line.contains('/ERROR]') || line.contains('/FATAL]')) &&
                            !(line.contains('IndexedMessageCodec') && line.contains('Received empty payload on channel fml:handshake')) &&
                            !(line.contains('ForgeConfig/CORE') && line.contains('Forge config just got changed on the file system!'))
                }
                if (!errors.isEmpty()) throw new GradleException("Unexpected client errors: ${errors.take(3)}")
            }
        }
    }
}

// ForgeGradle writes Slime Launcher's paths as bare Eclipse program arguments.
def eclipseLauncherPath = ~/(--(?:cache|metadata|to-srg|to-obf) )("[^"]*"|.+?)(?= (?:--metadata |--to-srg |--to-obf |--(?: |$)))/
tasks.matching { it.name.startsWith('genEclipseRun') && it.name.endsWith('ForForge') }.configureEach {
    dependsOn prepareRunClasses
    dependsOn { configurations.baseMetalsDevelopment }
    String launchName = name.replaceFirst('^genEclipseRun', 'run').replaceFirst('ForForge$', '') + '.launch'
    File launch = layout.projectDirectory.file(launchName).asFile
    doLast {
        Node configuration = new XmlParser().parse(launch)
        if (launchName in ['runClient.launch', 'runServer.launch']) {
            new Node(configuration, 'booleanAttribute',
                    [key: 'org.eclipse.jdt.launching.ATTR_EXCLUDE_TEST_CODE', value: 'true'])
        }
        Node programArguments = configuration.stringAttribute.find {
            it.attribute('key') == 'org.eclipse.jdt.launching.PROGRAM_ARGUMENTS'
        }
        String arguments = programArguments.attribute('value')
        String quoted = arguments.replaceAll(eclipseLauncherPath) { match, option, path ->
            path.startsWith('"') ? match : option + '"' + path + '"'
        }
        if (quoted != arguments) {
            programArguments.attributes().put('value', quoted)
            launch.setText(XmlUtil.serialize(configuration), 'UTF-8')
        }
    }
}

eclipse {
    synchronizationTasks 'genEclipseRuns'
    classpath.file.whenMerged { classpath ->
        classpath.entries.findAll { entry ->
            entry.path?.startsWith('src/integrationTest/') || entry.path?.startsWith('src/clientIntegrationTest/')
        }.each { entry -> entry.entryAttributes['test'] = 'true' }
    }
}

tasks.register('configureEclipseBuildship') {
    doLast {
        File target = file('.settings/org.eclipse.buildship.core.prefs')
        target.parentFile.mkdirs()
        Properties preferences = new Properties()
        ['eclipse.preferences.version': '1', 'connection.gradle.distribution': 'GRADLE_DISTRIBUTION(WRAPPER)',
         'connection.gradle.user.home': gradle.gradleUserHomeDir.canonicalPath,
         'connection.project.dir': '', 'gradle.user.home': gradle.gradleUserHomeDir.canonicalPath,
         'java.home': new File(System.getProperty('java.home')).canonicalPath,
         'override.workspace.settings': 'true'].each { key, value -> preferences.setProperty(key, value) }
        target.withOutputStream { preferences.store(it, 'Generated Modern Metals Buildship settings') }
    }
}
tasks.named('genEclipseRuns') { dependsOn 'configureEclipseBuildship' }

tasks.named('eclipse') { dependsOn 'genEclipseRuns' }

// Compatibility profiles are generated for available 1.14 add-ons only.

def baseMetalsModule = 'BaseMetals'
def baseMetalsCoordinate = "zone.moddev.mc.basemetals:${baseMetalsModule}:${basemetals_version}"
def withBaseMetals = providers.gradleProperty('withBaseMetals').map { it.toBoolean() }.orElse(false)
def localBasePinFile = file('local-basemetals.json')
def releaseBuild = providers.gradleProperty('releaseBuild').map { it.toBoolean() }.orElse(false).get()
def useLocalBaseMetals = providers.gradleProperty('useLocalBaseMetals')
        .map { it.toBoolean() }.orElse(localBasePinFile.isFile() && !releaseBuild).get()
if (useLocalBaseMetals && releaseBuild) throw new GradleException('Release builds must use published Base Metals')
def localBasePin = useLocalBaseMetals && localBasePinFile.isFile()
        ? new groovy.json.JsonSlurper().parse(localBasePinFile) : [:]
if (useLocalBaseMetals && localBasePin.isEmpty()) throw new GradleException('Run pinLocalBaseMetals first')
def oreSpawnCoordinate = "zone.moddev.mc.orespawn:OreSpawn:${orespawn_version}"
def dependencyMirror = providers.gradleProperty('dependencyMirror').orElse('https://maven.moddev.zone/releases')
repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
    maven { url = uri("https://maven.moddev.zone/releases") }
    maven { url = 'https://libraries.minecraft.net/' }
    exclusiveContent {
        forRepository { maven { url = 'https://repo.spongepowered.org/repository/maven-public' } }
        filter { includeGroupAndSubgroups('org.spongepowered') }
    }
    exclusiveContent {
        forRepository {
            maven {
                url = uri(dependencyMirror.get())
                metadataSources { artifact() }
            }
        }
        filter { includeModule('zone.moddev.mc.basemetals', baseMetalsModule) }
    }
}

configurations {
    oreSpawnRelease
    baseMetalsRelease
    baseMetalsDevelopment
}

def mappedBaseMetals = useLocalBaseMetals ? files(file(localBasePin.mappedJar)) : renamer.dependency(baseMetalsCoordinate)
dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
    implementation renamer.dependency(oreSpawnCoordinate)
    oreSpawnRelease oreSpawnCoordinate
    baseMetalsRelease baseMetalsCoordinate
    baseMetalsDevelopment mappedBaseMetals
    if (withBaseMetals.get()) runtimeOnly mappedBaseMetals
}

renamer.mappings.from minecraft.dependency.toSrgFile

tasks.register('verifyReleaseDependencies') {
    inputs.files(configurations.oreSpawnRelease)
    inputs.property('orespawnSha256', orespawn_sha256)
    doLast {
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        configurations.oreSpawnRelease.singleFile.withInputStream { input ->
            byte[] buffer = new byte[8192]
            for (int count = input.read(buffer); count != -1; count = input.read(buffer)) {
                digest.update(buffer, 0, count)
            }
        }
        if (digest.digest().encodeHex().toString() != orespawn_sha256) {
            throw new GradleException('OreSpawn 1.14.4 release checksum mismatch')
        }
    }
}

def baseJarHash = { File jar -> java.security.MessageDigest.getInstance('SHA-256').digest(jar.bytes).encodeHex().toString() }
tasks.register('pinLocalBaseMetals') {
    group = 'development'
    description = 'Pins already-built sibling Base Metals jars for local testing.'
    doLast {
        File checkout = file(providers.gradleProperty('baseMetalsCheckout').orElse('../../BaseMetals 114/BaseMetals').get()).canonicalFile
        def pins = [version: basemetals_version.toString()]
        ['publishedJar': "build/libs/BaseMetals-${basemetals_version}.jar",
         'mappedJar': "build/libs-dev/BaseMetals-${basemetals_version}-deobf.jar"].each { key, path ->
            File jar = new File(checkout, path)
            if (!jar.isFile()) throw new GradleException("Build Base Metals first: ${jar}")
            pins[key] = jar.canonicalPath
            pins[key + 'Sha256'] = baseJarHash(jar)
        }
        localBasePinFile.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(pins)) + '\n', 'UTF-8')
    }
}
def verifyLocalBase = tasks.register('verifyLocalBaseMetals') {
    group = 'verification'
    doLast {
        if (!useLocalBaseMetals) return
        if (localBasePin.version != basemetals_version.toString()) throw new GradleException('Local Base Metals version mismatch')
        ['publishedJar', 'mappedJar'].each { key ->
            File jar = file(localBasePin[key])
            if (!jar.isFile() || baseJarHash(jar) != localBasePin[key + 'Sha256'])
                throw new GradleException("Local Base Metals changed. Rebuild, then run pinLocalBaseMetals: ${jar}")
        }
    }
}
tasks.withType(JavaExec).configureEach {
    if (name in ['runClient', 'runServer', 'runProbeClient', 'runRuntimeProbeServer'] && withBaseMetals.get())
        dependsOn verifyLocalBase
}
tasks.register('prepareBaseMetalsProfile', Copy) {
    dependsOn verifyLocalBase
    from configurations.baseMetalsDevelopment
    into layout.projectDirectory.dir('run/with-basemetals/mods')
    rename { "BaseMetals-${basemetals_version}-mapped.jar" }
    doFirst {
        if (useLocalBaseMetals) return
        def hash = java.security.MessageDigest.getInstance('SHA-256')
                .digest(configurations.baseMetalsRelease.singleFile.bytes).encodeHex().toString()
        if (hash != basemetals_sha256) throw new GradleException('Published Base Metals checksum mismatch')
    }
    doLast {
        File target = file("run/with-basemetals/mods/BaseMetals-${basemetals_version}-mapped.jar")
        if (baseJarHash(target) != baseJarHash(configurations.baseMetalsDevelopment.singleFile))
            throw new GradleException('Combined profile Base Metals jar does not match the selected candidate')
    }
}

tasks.register('generateCompatibilityRuns') {
    dependsOn 'genEclipseRuns', 'prepareBaseMetalsProfile'
    doLast {
        if (project.ext.has('siblingCompatibilityEnabled') && siblingCompatibilityEnabled) return
        File original = file('runClient.launch')
        Node launch = new XmlParser().parse(original)
        launch.stringAttribute.find { it.attribute('key') == 'org.eclipse.jdt.launching.WORKING_DIRECTORY' }
                .attributes().put('value', file('run/with-basemetals').absolutePath)
        file('runClientWithBaseMetals.launch').setText(XmlUtil.serialize(launch), 'UTF-8')
    }
}
tasks.named('eclipse') { dependsOn 'generateCompatibilityRuns' }
eclipse.synchronizationTasks 'generateCompatibilityRuns'

ext.compatibilityBaseFiles = { [mapped: configurations.baseMetalsDevelopment.singleFile,
        version: basemetals_version.toString()] }
apply from: 'gradle/eclipse-compatibility-114.gradle'

tasks.register('verifyEclipseProductionClasspath') {
    group = 'verification'
    dependsOn 'eclipse'
    doLast {
        ['runClient.launch', 'runServer.launch', 'runClientWithBaseMetals.launch'].each { name ->
            Node launch = new XmlParser().parse(file(name))
            if (!launch.booleanAttribute.any { it.attribute('key') == 'org.eclipse.jdt.launching.ATTR_EXCLUDE_TEST_CODE' && it.attribute('value') == 'true' })
                throw new GradleException("${name} must exclude test code")
            String modClasses = launch.mapAttribute.mapEntry.find { it.attribute('key') == 'MOD_CLASSES' }.attribute('value')
            if (modClasses.contains('probe') || !modClasses.contains(runClasses.get().asFile.absolutePath))
                throw new GradleException("${name} leaks test classes")
            String arguments = launch.stringAttribute.find { it.attribute('key') == 'org.eclipse.jdt.launching.PROGRAM_ARGUMENTS' }.attribute('value')
            def paths = arguments =~ /--(?:cache|metadata|to-srg|to-obf) "([^"]+)"/
            int count = 0
            paths.each { match ->
                if (!new File(match[1]).exists()) throw new GradleException("${name} has a missing launcher input")
                count++
            }
            if (count != 4) throw new GradleException("${name} needs four quoted launcher paths")
        }
        Properties prefs = new Properties()
        file('.settings/org.eclipse.buildship.core.prefs').withInputStream { prefs.load(it) }
        if (prefs.getProperty('gradle.user.home') != gradle.gradleUserHomeDir.canonicalPath)
            throw new GradleException('Buildship uses a different physical Gradle cache')
    }
}

