def probeJar = tasks.register('packagedProbeDeobfJar', Jar) {
    dependsOn 'integrationTestClasses'
    from sourceSets.integrationTest.output
    archiveFileName = 'modernmetalsprobe-deobf.jar'
    destinationDirectory = layout.buildDirectory.dir('packaged-probes')
}
def packagedProbeJar = renamer.classes(probeJar) {
    map.from minecraft.dependency.toSrgFile
    output = layout.buildDirectory.file('packaged-probes/modernmetalsprobe.jar')
}
tasks.register('runPackagedProbeServer', Exec) {
    group = 'verification'
    dependsOn releaseJar, packagedProbeJar, 'verifyReleaseDependencies'
    dependsOn verifyLocalBase
    timeout = java.time.Duration.ofMinutes(5)
    doFirst {
        File directory = file(providers.gradleProperty('probeDirectory').orElse('build/packaged-probe-server').get()).canonicalFile
        if (!directory.toPath().startsWith(layout.buildDirectory.get().asFile.canonicalFile.toPath())
                && !new File(directory, '.modernmetals-disposable-test').isFile()) {
            throw new GradleException('Packaged probe requires a build directory or an explicitly marked disposable copy')
        }
        directory.mkdirs()
        File mods = new File(directory, 'mods')
        copy {
            from releaseJar, packagedProbeJar, configurations.oreSpawnRelease
            if (withBaseMetals.get()) from(useLocalBaseMetals ? files(file(localBasePin.publishedJar)) : configurations.baseMetalsRelease)
            into mods
        }
        if (!new File(directory, 'eula.txt').exists()) new File(directory, 'eula.txt').text = 'eula=true\n'
        if (!new File(directory, 'server.properties').exists()) new File(directory, 'server.properties').text =
                'online-mode=false\nserver-port=0\nview-distance=2\nspawn-protection=0\nmax-tick-time=0\nlevel-seed=14162026\n'
        File receipt = new File(directory, 'modernmetals-probe.json')
        if (receipt.exists()) java.nio.file.Files.move(receipt.toPath(),new File(directory,
                'modernmetals-probe.' + System.currentTimeMillis() + '.previous.json').toPath())
        def runtime = providers.gradleProperty('packagedForgeServerRuntime').get()
        File launcher = new File(runtime, "forge-${minecraft_version}-${forge_version}.jar")
        if (!launcher.isFile()) throw new GradleException('Official Forge server runtime is incomplete')
        workingDir directory
        commandLine javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(8) }.get().executablePath.asFile,
                '-Xmx2g', '-Dmodernmetalsprobe.upgrade=' + providers.gradleProperty('probeWorldUpgrade').orElse('false').get(),
                '-Dmodernmetalsprobe.titanium=' + providers.gradleProperty('probeTitanium').orElse('false').get(),
                '-jar', launcher.absolutePath, 'nogui'
        if (providers.gradleProperty('probeWorldUpgrade').orElse('false').get().toBoolean()) args '--forceUpgrade'
    }
    doLast {
        File receipt = new File(workingDir, 'modernmetals-probe.json')
        if (!receipt.isFile() || new groovy.json.JsonSlurper().parse(receipt).status != 'passed')
            throw new GradleException("Packaged test failed; see ${receipt}")
    }
}

