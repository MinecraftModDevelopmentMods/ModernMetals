import groovy.xml.XmlParser
import groovy.xml.XmlUtil

plugins {
    id 'java'
    id 'maven-publish'
    id 'eclipse'
    id 'net.minecraftforge.renamer' version '1.1.5'
    id 'net.minecraftforge.gradle' version '7.0.34'
}

group = mod_group
version = mod_version
base.archivesName = 'ModernMetals'

java {
    toolchain.languageVersion = JavaLanguageVersion.of(8)
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

def compileMiningLevelChecks = tasks.register('compileMiningLevelChecks', JavaCompile) {
    dependsOn 'classes'
    source fileTree('tools/validation/port113/mining-levels') { include '*.java' }
    classpath = sourceSets.main.output + sourceSets.main.compileClasspath
    destinationDirectory = layout.buildDirectory.dir('classes/mining-level-checks')
    javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(8) }
}
tasks.register('verifyMiningLevels', JavaExec) {
    dependsOn compileMiningLevelChecks
    classpath = files(compileMiningLevelChecks.flatMap { it.destinationDirectory }) + sourceSets.main.runtimeClasspath
    mainClass = 'validation.MiningLevelChecks'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(8) }
}
tasks.named('check') { dependsOn 'verifyMiningLevels' }
tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:none', '-quiet')
    options.addBooleanOption('notimestamp', true)
}
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

def runClasses = layout.buildDirectory.dir('forge-run-mod-classes/main')
def prepareRunClasses = tasks.register('prepareForgeRunModClasses', Sync) {
    dependsOn tasks.named('classes')
    from sourceSets.main.output
    into runClasses
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    runs {
        configureEach {
            mainClass = 'net.minecraftforge.userdev.LaunchTesting'
            workingDir.convention layout.projectDirectory.dir('run')
            mods { modernmetals { source sourceSets.main } }
            environment 'target', 'fmluserdev' + name
            environment 'MCP_MAPPINGS', "${mapping_channel}_${mapping_version}"
            environment 'MCP_VERSION', mcp_version
            environment 'FORGE_VERSION', forge_version
            environment 'FORGE_GROUP', 'net.minecraftforge'
            environment 'MC_VERSION', minecraft_version
            def output = runClasses.get().asFile.absolutePath
            environment 'MOD_CLASSES', "modernmetals%%${output}${File.pathSeparator}modernmetals%%${output}"
        }
        register('client')
        register('server') { args '--nogui' }
    }
}

tasks.withType(JavaExec).configureEach {
    if (name in ['runClient', 'runServer']) {
        dependsOn prepareRunClasses
        javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(8) }
        doFirst { new File(workingDir, 'mods').mkdirs() }
    }
}

// ForgeGradle writes Slime Launcher's paths as bare Eclipse program arguments.
def eclipseLauncherPath = ~/(--(?:cache|metadata|to-srg|to-obf) )("[^"]*"|.+?)(?= (?:--metadata |--to-srg |--to-obf |--(?: |$)))/
tasks.matching { it.name.startsWith('genEclipseRun') && it.name.endsWith('ForForge') }.configureEach {
    dependsOn prepareRunClasses
    String launchName = name.replaceFirst('^genEclipseRun', 'run').replaceFirst('ForForge$', '') + '.launch'
    File launch = layout.projectDirectory.file(launchName).asFile
    doLast {
        Node configuration = new XmlParser().parse(launch)
        Node programArguments = configuration.stringAttribute.find {
            it.attribute('key') == 'org.eclipse.jdt.launching.PROGRAM_ARGUMENTS'
        }
        String arguments = programArguments.attribute('value')
        String quoted = arguments.replaceAll(eclipseLauncherPath) { match, option, path ->
            path.startsWith('"') ? match : option + '"' + path + '"'
        }
        if (quoted != arguments) {
            programArguments.attributes().put('value', quoted)
            launch.setText(XmlUtil.serialize(configuration), 'UTF-8')
        }
    }
}

eclipse {
    synchronizationTasks 'genEclipseRuns'
}

tasks.named('eclipse') { dependsOn 'genEclipseRuns' }

apply from: 'gradle/eclipse-compatibility.gradle'

def oreSpawnModule = 'mmd-orespawn-245586'
def oreSpawnCoordinate = "curse.maven:${oreSpawnModule}:${orespawn_curse_file}"
def dependencyMirror = providers.gradleProperty('dependencyMirror').orElse('https://www.cursemaven.com')
repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
    maven { url = 'https://libraries.minecraft.net/' }
    exclusiveContent {
        forRepository { maven { url = 'https://repo.spongepowered.org/repository/maven-public' } }
        filter { includeGroupAndSubgroups('org.spongepowered') }
    }
    exclusiveContent {
        forRepository {
            maven {
                url = uri(dependencyMirror.get())
                metadataSources { artifact() }
            }
        }
        filter { includeModule('curse.maven', oreSpawnModule) }
    }
}

configurations {
    oreSpawnRelease
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
    implementation renamer.dependency(oreSpawnCoordinate)
    oreSpawnRelease oreSpawnCoordinate
}

renamer.mappings.from minecraft.dependency.toSrgFile

tasks.register('verifyReleaseDependencies') {
    inputs.files(configurations.oreSpawnRelease)
    inputs.property('orespawnSha256', orespawn_sha256)
    doLast {
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        configurations.oreSpawnRelease.singleFile.withInputStream { input ->
            byte[] buffer = new byte[8192]
            for (int count = input.read(buffer); count != -1; count = input.read(buffer)) {
                digest.update(buffer, 0, count)
            }
        }
        if (digest.digest().encodeHex().toString() != orespawn_sha256) {
            throw new GradleException('OreSpawn 1.13.2 release checksum mismatch')
        }
    }
}

sourceSets.main.resources.srcDir('src/generated/resources')

def recipeData = layout.buildDirectory.dir('generated/recipe-data')
def generateRecipeData = tasks.register('generateRecipeData', Exec) {
    group = 'data generation'
    inputs.file 'tools/generate_113_recipe_data.js'
    inputs.file 'src/main/java/zone/moddev/mc/modernmetals/material/MaterialCatalogue.java'
    inputs.files(fileTree('src/main/resources/data'), fileTree('src/generated/resources/data'))
    outputs.dir recipeData
    commandLine 'node', 'tools/generate_113_recipe_data.js'
}
sourceSets.main.resources.srcDir(recipeData)
tasks.named('processResources') { dependsOn generateRecipeData }
tasks.named('sourcesJar') { dependsOn generateRecipeData }

def verifyFluidRegistration = tasks.register('verifyFluidRegistration', Exec) {
    group = 'verification'
    description = 'Checks that shared fluid registries are only written during sequential registration.'
    commandLine 'node', '--test', 'tools/test_fluid_registration.js'
}
tasks.named('check') { dependsOn verifyFluidRegistration }

def verifyRecipeData = tasks.register('verifyRecipeData', Exec) {
    group = 'verification'
    dependsOn generateRecipeData
    commandLine 'node', '--test', 'tools/test_113_recipe_data.js'
}
tasks.named('check') { dependsOn verifyRecipeData }

tasks.named('processResources') {
    inputs.property('modVersion', mod_version)
    filesMatching('META-INF/mods.toml') { expand mod_version: mod_version }
    exclude 'mcmod.info', 'assets/modernmetals/recipes/**', 'assets/modernmetals/alt/**',
            'assets/modernmetals/materials/**', 'assets/modernmetals/lang/*.lang',
            'META-INF/modernmetals-legacy-api.list'
}

tasks.named('jar', Jar) {
    archiveClassifier = 'deobf'
    destinationDirectory = layout.buildDirectory.dir('libs-dev')
}

def releaseJar = renamer.classes(tasks.named('jar', Jar)) {
    map.from minecraft.dependency.toSrgFile
    archiveClassifier = null
    output = layout.buildDirectory.file("libs/ModernMetals-${project.version}.jar")
}

tasks.named('assemble') { dependsOn releaseJar }
tasks.named('check') { dependsOn 'verifyReleaseDependencies' }

apply from: 'gradle/development-orespawn.gradle'

apply from: 'gradle/release-113.gradle'
