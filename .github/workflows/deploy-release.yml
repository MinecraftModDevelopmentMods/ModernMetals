name: Release Modern Metals 1.13.2
run-name: Modern Metals ${{ inputs.release_version }} (${{ inputs.confirm_live_publication && 'publish' || 'verify' }})

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Four-part version for Minecraft 1.13.2
        required: true
        type: string
      release_commit:
        description: Full SHA of the checked MMD master-1.13.2 commit
        required: true
        type: string
      tested_jar_sha256:
        description: SHA-256 of the qualified game jar
        required: true
        type: string
      curseforge_release_level:
        description: CurseForge release level
        required: true
        default: release
        type: choice
        options: [release, beta, alpha]
      confirm_live_publication:
        description: Publish the verified CI files to Maven, CurseForge and GitHub
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: modernmetals-release-113
  cancel-in-progress: false

jobs:
  qualify:
    name: Verify merged CI candidate
    if: github.repository == 'MinecraftModDevelopmentMods/ModernMetals' && github.ref == 'refs/heads/master-1.13.2'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    outputs:
      ci_run: ${{ steps.candidate.outputs.ci_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.release_commit }}
          fetch-depth: 0
      - name: Verify branch, version and successful merged CI
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          RELEASE_SHA: ${{ inputs.release_commit }}
          TESTED_SHA: ${{ inputs.tested_jar_sha256 }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.113021$ ]]
          [[ "$RELEASE_SHA" =~ ^[[:xdigit:]]{40}$ ]]
          [[ "$TESTED_SHA" =~ ^[[:xdigit:]]{64}$ ]]
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/master-1.13.2" --jq .commit.sha)" = "$RELEASE_SHA"
          grep -Fxq "mod_version=$RELEASE_VERSION" gradle.properties
          grep -Fxq 'minecraft_version=1.13.2' gradle.properties
          ci_run="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f branch=master-1.13.2 -f head_sha="$RELEASE_SHA" -f event=push -f status=success \
            --jq '.workflow_runs[0].id // empty')"
          test -n "$ci_run"
          echo "ci_run=$ci_run" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ModernMetals-1.13.2-${{ inputs.release_commit }}
          run-id: ${{ steps.candidate.outputs.ci_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/release-input
      - name: Verify sealed files and tested game jar
        working-directory: ${{ runner.temp }}/release-input
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          TESTED_SHA: ${{ inputs.tested_jar_sha256 }}
        run: |
          set -euo pipefail
          python3 - "$RELEASE_VERSION" "$TESTED_SHA" <<'PY'
          from pathlib import Path
          import hashlib, sys
          version, tested = sys.argv[1:]
          names = [f'ModernMetals-{version}{suffix}.jar' for suffix in ('', '-sources', '-javadoc')]
          assert {p.name for p in Path('.').iterdir()} == set(names + ['SHA256SUMS', 'CHANGELOG.txt'])
          actual = {name: hashlib.sha256(Path(name).read_bytes()).hexdigest() for name in names}
          declared = dict((name, sha) for sha, name in (line.split('  ', 1) for line in Path('SHA256SUMS').read_text().splitlines()))
          assert actual == declared
          assert actual[names[0]] == tested.lower()
          assert version in Path('CHANGELOG.txt').read_text().splitlines()[0]
          PY
      - name: Verify live publication credentials
        if: inputs.confirm_live_publication
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          MAVEN_UPLOAD_URL: ${{ secrets.MAVEN_UPLOAD_URL }}
          MAVEN_UPLOAD_USERNAME: ${{ secrets.MAVEN_UPLOAD_USERNAME }}
          MAVEN_UPLOAD_PASSWORD: ${{ secrets.MAVEN_UPLOAD_PASSWORD }}
        run: |
          set -euo pipefail
          for name in CURSEFORGE_TOKEN MAVEN_UPLOAD_URL MAVEN_UPLOAD_USERNAME MAVEN_UPLOAD_PASSWORD; do
            test -n "${!name}" || { echo "Configure $name for this repository" >&2; exit 1; }
          done
          [[ "$MAVEN_UPLOAD_URL" == https://* ]]
          curl --fail --silent --show-error --max-time 30 \
            -H "X-Api-Token: $CURSEFORGE_TOKEN" https://minecraft.curseforge.com/api/game/versions >/dev/null
      - name: Reserve the version for this commit
        if: inputs.confirm_live_publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          RELEASE_SHA: ${{ inputs.release_commit }}
        run: |
          set -euo pipefail
          if existing="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_VERSION" --jq .object.sha 2>/dev/null)"; then
            test "$existing" = "$RELEASE_SHA"
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$RELEASE_VERSION" -f sha="$RELEASE_SHA" >/dev/null
          fi

  publish_maven:
    name: Publish MMD Maven
    needs: qualify
    if: inputs.confirm_live_publication
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.release_commit }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25.0.3+9.0.LTS'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '8.0.502+7'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17.0.1+12'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ModernMetals-1.13.2-${{ inputs.release_commit }}
          run-id: ${{ needs.qualify.outputs.ci_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/release-input
      - name: Stage checksum-verified published dependencies
        run: bash gradle/stage-orespawn-release.sh .gradle/release-dependencies
      - name: Publish the sealed Maven jars
        env:
          MAVEN_UPLOAD_URL: ${{ secrets.MAVEN_UPLOAD_URL }}
          MAVEN_UPLOAD_USERNAME: ${{ secrets.MAVEN_UPLOAD_USERNAME }}
          MAVEN_UPLOAD_PASSWORD: ${{ secrets.MAVEN_UPLOAD_PASSWORD }}
        run: |
          bash ./gradlew publishMavenJavaPublicationToReleaseRepository \
            -PpreparedReleaseDir="${{ runner.temp }}/release-input" -PdependencyMirror="$PWD/.gradle/release-dependencies" \
            --no-daemon --stacktrace --max-workers=2 \
            "-Dorg.gradle.java.installations.paths=$JAVA_HOME,$JAVA_HOME_8_X64,$JAVA_HOME_25_X64" \
            -Dorg.gradle.java.installations.auto-detect=false -Dorg.gradle.java.installations.auto-download=false

  publish_curseforge:
    name: Publish CurseForge
    needs: [qualify, publish_maven]
    if: inputs.confirm_live_publication
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ModernMetals-1.13.2-${{ inputs.release_commit }}
          run-id: ${{ needs.qualify.outputs.ci_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/release-input
      - name: Verify the sealed jars
        working-directory: ${{ runner.temp }}/release-input
        run: sha256sum --check --strict SHA256SUMS
      - name: Publish Modern Metals
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3.1
        with:
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          curseforge-id: '244357'
          name: Modern Metals ${{ inputs.release_version }} for Minecraft 1.13.2 (Forge)
          version: ${{ inputs.release_version }}
          version-type: ${{ inputs.curseforge_release_level }}
          changelog-file: ${{ runner.temp }}/release-input/CHANGELOG.txt
          loaders: forge
          game-versions: '1.13.2'
          game-version-filter: none
          environment: client | server
          java: Java 8
          curseforge-dependencies: |
            245586(required)
            240967(optional)
          fail-mode: fail
          files: |
            ${{ runner.temp }}/release-input/ModernMetals-${{ inputs.release_version }}.jar
            ${{ runner.temp }}/release-input/ModernMetals-${{ inputs.release_version }}-sources.jar
            ${{ runner.temp }}/release-input/ModernMetals-${{ inputs.release_version }}-javadoc.jar

  publish_github:
    name: Publish GitHub Release
    needs: [qualify, publish_curseforge]
    if: inputs.confirm_live_publication
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ModernMetals-1.13.2-${{ inputs.release_commit }}
          run-id: ${{ needs.qualify.outputs.ci_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/release-input
      - name: Create the GitHub release from the sealed files
        working-directory: ${{ runner.temp }}/release-input
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          sha256sum --check --strict SHA256SUMS
          gh release create "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Modern Metals $RELEASE_VERSION for Minecraft 1.13.2 (Forge)" \
            --notes-file CHANGELOG.txt "ModernMetals-$RELEASE_VERSION"{,-sources,-javadoc}.jar SHA256SUMS
