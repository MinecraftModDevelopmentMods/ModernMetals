name: Modern Metals 1.13.2 CI

on:
  push:
    branches: [master-1.13.2, 'feature/**']
  pull_request:
    branches: [master-1.13.2]

permissions:
  contents: read

concurrency:
  group: modernmetals-113-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - name: Install Java 25 for Mavenizer
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25.0.3+9.0.LTS'
      - name: Install Java 8 for compilation
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '8.0.502+7'
      - name: Install Java 17 for Gradle
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17.0.1+12'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - name: Stage checksum-verified published dependencies
        run: bash gradle/stage-orespawn-release.sh .gradle/release-dependencies
      - name: Build, audit and generate Eclipse launches
        run: |
          bash ./gradlew clean check build javadoc verify113ReleaseArtifacts write113ReleaseChecksums genEclipseRuns eclipse \
            -PreleaseBuild=true -PdependencyMirror="$PWD/.gradle/release-dependencies" \
            --no-daemon --stacktrace --max-workers=2 \
            "-Dorg.gradle.java.installations.paths=$JAVA_HOME,$JAVA_HOME_8_X64,$JAVA_HOME_25_X64" \
            -Dorg.gradle.java.installations.auto-detect=false \
            -Dorg.gradle.java.installations.auto-download=false
      - name: Stage the flat release bundle
        run: |
          mkdir -p build/release-bundle
          cp build/libs/*.jar build/release/SHA256SUMS CHANGELOG.txt build/release-bundle/
      - name: Upload audited release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ModernMetals-1.13.2-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: build/release-bundle/
      - name: Retain failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ModernMetals-1.13.2-diagnostics-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            build/test-results/**
            build/reports/**
