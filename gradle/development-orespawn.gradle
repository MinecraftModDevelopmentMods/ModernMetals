import groovy.xml.XmlParser
import groovy.xml.XmlUtil
import java.security.MessageDigest
import java.util.jar.JarFile

// An optional manual-test engine. Compilation and publication still use the release pin.
File candidate = layout.projectDirectory.file('run/compatibility-jars/orespawn-development.jar').asFile
boolean enabled = candidate.isFile() && providers.gradleProperty('useDevelopmentOreSpawn')
        .map { it.toBoolean() }.getOrElse(false)
tasks.matching { it.name in ['genEclipseRunClientForForge', 'genEclipseRunServerForForge'] }.configureEach {
    inputs.property('usesDevelopmentOreSpawn', enabled)
}
if (!enabled) return
File checksum = new File(candidate.parentFile, 'orespawn-development.sha256')
String publishedName = "mmd-orespawn-245586-${orespawn_curse_file}-renamed.jar"

def verifyCandidate = tasks.register('verifyDevelopmentOreSpawn') {
    inputs.file candidate
    inputs.file checksum
    inputs.files configurations.oreSpawnRelease
    doLast {
        String expected = checksum.text.trim().toLowerCase(Locale.ROOT)
        String actual = MessageDigest.getInstance('SHA-256').digest(candidate.bytes).encodeHex().toString()
        if (!(expected ==~ /[0-9a-f]{64}/) || actual != expected) {
            throw new GradleException('The development OreSpawn jar does not match its recorded checksum.')
        }
        new JarFile(configurations.oreSpawnRelease.singleFile).withCloseable { release ->
            new JarFile(candidate).withCloseable { development ->
                String version = release.manifest.mainAttributes.getValue('Implementation-Version')
                if (development.manifest.mainAttributes.getValue('Implementation-Version') != version) {
                    throw new GradleException('The development OreSpawn jar targets a different release. Update or disable it.')
                }
                def api = release.entries().toList().findAll {
                    it.name.startsWith('zone/moddev/mc/orespawn/api/') && it.name.endsWith('.class')
                }
                if (api.empty) throw new GradleException('The pinned OreSpawn public API is missing.')
                api.each { entry ->
                    def replacement = development.getJarEntry(entry.name)
                    if (replacement == null || !Arrays.equals(release.getInputStream(entry).bytes,
                            development.getInputStream(replacement).bytes)) {
                        throw new GradleException("The development engine changes the pinned public API: ${entry.name}")
                    }
                }
            }
        }
    }
}

def renameJarType = renamer.class.classLoader.loadClass('net.minecraftforge.renamer.gradle.RenameJar')
def mappedCandidate = tasks.register('mapDevelopmentOreSpawn', renameJarType, renamer)
mappedCandidate.configure {
    dependsOn verifyCandidate
    input.set(candidate)
    output.set(layout.buildDirectory.file('development/OreSpawn-development-mapped.jar'))
    map.from minecraft.dependency.toSrgFile
    reverse.set(true)
    // Published Forge 1.13 jars retain named classes with SRG member names.
    naiveSrg.set(true)
    accessTransformers.set(true)
    libraries.from(sourceSets.main.compileClasspath.filter { it.name != publishedName })
}

def developmentClasspath = { JavaExec run ->
    def original = run.classpath.files.toList()
    if (original.count { it.name == publishedName } != 1) {
        throw new GradleException('Expected one published OreSpawn entry in the normal development runtime.')
    }
    original.findAll { it.name != publishedName } + mappedCandidate.get().output.get().asFile
}

tasks.withType(JavaExec).configureEach {
    if (name in ['runClient', 'runServer']) {
        dependsOn mappedCandidate
        doFirst { JavaExec run -> run.classpath = project.files(developmentClasspath(run)) }
    }
}

tasks.matching { it.name in ['genEclipseRunClientForForge', 'genEclipseRunServerForForge'] }.configureEach {
    dependsOn mappedCandidate
    doLast {
        String runName = name.replaceFirst('^genEclipseRun', 'run').replaceFirst('ForForge$', '')
        File launch = layout.projectDirectory.file(runName + '.launch').asFile
        Node configuration = new XmlParser().parse(launch)
        Node entries = configuration.listAttribute.find {
            it.attribute('key') == 'org.eclipse.jdt.launching.CLASSPATH'
        }
        def jre = entries.listEntry.findAll {
            new XmlParser().parseText(it.attribute('value')).attribute('containerPath')?.startsWith(
                    'org.eclipse.jdt.launching.JRE_CONTAINER/')
        }.collect { it.attribute('value') }
        entries.children().clear()
        developmentClasspath(tasks.named(runName, JavaExec).get()).each { File entry ->
            Node runtimeEntry = new Node(null, 'runtimeClasspathEntry',
                    [externalArchive: entry.absolutePath, type: '2', path: '5'])
            new Node(entries, 'listEntry', [value: XmlUtil.serialize(runtimeEntry)])
        }
        jre.each { new Node(entries, 'listEntry', [value: it]) }
        launch.setText(XmlUtil.serialize(configuration), 'UTF-8')
    }
}
